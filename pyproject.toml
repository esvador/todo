[project]
name = "todo-api"
version = "0.1.0"
description = "Todo API на FastAPI с JWT-авторизацией"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # предупреждение внутри starlette.testclient, к нашему коду не относится
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # сортировка импортов
    "B",   # типичные ошибки
    "UP",  # современный синтаксис Python
    "SIM", # упрощения
]
ignore = [
    "B008", # Depends() в аргументах по умолчанию: стандартный приём FastAPI
]

[tool.ruff.lint.isort]
# папка alembic/ в корне иначе путается с библиотекой alembic
known-third-party = ["alembic"]
